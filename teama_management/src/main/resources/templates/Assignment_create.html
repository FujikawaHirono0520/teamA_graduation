<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>課題登録 - 課題管理システム</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <header th:replace="~{fragments/header :: header(true)}"></header>

    <main class="assignment-create-wrapper">
        <!-- 戻る・タイトル・リーダーバッジ -->
        <div class="assignment-title-bar">
            <div class="assignment-title-left">
                <a th:href="@{/assignments}" class="back-link">&larr;</a>
                <h1>課題登録</h1>
            </div>
            <span class="assignment-role-badge">リーダー</span>
        </div>

        <form th:action="@{/assignments/create}" th:object="${form}" method="post" enctype="multipart/form-data"
            novalidate>
            <!-- 課題名 -->
            <div class="assignment-field">
                <label for="title">課題名</label>
                <input type="text" id="title" class="assignment-input" th:field="*{title}" placeholder="例）第4回レポート課題">
                <p class="assignment-error" th:if="${titleErrorMessage}" th:text="'※' + ${titleErrorMessage}"></p>
            </div>

            <!-- 対象（チーム / 個人） -->
            <div class="assignment-field">
                <label>対象</label>
                <div class="target-toggle-group">
                    <label class="target-pill" th:classappend="${form.targetType == 'team'} ? ' is-active' : ''">
                        <input type="radio" name="targetType" value="team" th:field="*{targetType}"
                            onchange="onTargetTypeChange()">
                        <span>チーム</span>
                    </label>
                    <label class="target-pill" th:classappend="${form.targetType == 'individual'} ? ' is-active' : ''">
                        <input type="radio" name="targetType" value="individual" th:field="*{targetType}"
                            onchange="onTargetTypeChange()">
                        <span>個人</span>
                    </label>
                </div>
                <p class="assignment-error" th:if="${targetErrorMessage}" th:text="'※' + ${targetErrorMessage}"></p>
            </div>

            <!-- チーム選択（チーム選択時に表示） -->
            <div class="assignment-field" id="teamTargetSection"
                th:style="${form.targetType == 'team'} ? '' : 'display: none;'">
                <label for="teamId">チーム</label>
                <select id="teamId" class="assignment-select" th:field="*{teamId}">
                    <option value="">チームを選択してください</option>
                    <option th:each="team : ${leaderTeams}" th:value="${team}" th:text="${team}"></option>
                </select>
            </div>

            <!-- 名前で検索・選択（個人選択時に表示） -->
            <div class="assignment-field" id="individualTargetSection"
                th:style="${form.targetType == 'individual'} ? '' : 'display: none;'">
                <label for="userSearchInput">名前で検索（複数選択可）</label>
                <div class="user-search-box">
                    <input type="text" id="userSearchInput" class="assignment-input" placeholder="田中"
                        oninput="filterCandidates()" autocomplete="off">
                    <ul id="candidateList" class="user-candidate-list" style="display: none;"></ul>
                </div>

                <!-- 選択済みユーザーチップ -->
                <div id="selectedUsersContainer" class="selected-user-chips">
                    <div class="selected-user-chip" th:each="userId : ${form.assigneeIds}" th:data-uid="${userId}">
                        <span class="chip-user-name" th:text="${userId}"></span>
                        <span class="chip-user-id" th:text="'ID:' + ${userId}"></span>
                        <button type="button" class="chip-remove-btn" onclick="removeUserChip(this)"
                            aria-label="削除">&times;</button>
                        <input type="hidden" name="assigneeIds" th:value="${userId}">
                    </div>
                </div>
            </div>

            <!-- 締め切り日時 -->
            <div class="assignment-field">
                <label for="dueDate">締め切り日時</label>
                <input type="datetime-local" id="dueDate" class="assignment-input" th:field="*{dueDate}">
                <p class="assignment-error" th:if="${dueDateErrorMessage}" th:text="'※' + ${dueDateErrorMessage}"></p>
            </div>

            <!-- 優先順位 -->
            <div class="assignment-field">
                <label for="priority">優先順位</label>
                <select id="priority" class="assignment-select" th:field="*{priority}">
                    <option value="高">高</option>
                    <option value="中" selected>中</option>
                    <option value="低">低</option>
                </select>
            </div>

            <!-- 説明・添付資料 -->
            <div class="assignment-field">
                <label for="description">説明・添付資料</label>
                <textarea id="description" class="assignment-textarea" th:field="*{description}" rows="3"
                    placeholder="内容を入力（ファイルを添付）"></textarea>
                <input type="file" id="attachmentFile" class="assignment-file-input" th:field="*{attachmentFile}">
            </div>

            <!-- 登録失敗エラー -->
            <p class="assignment-error" th:if="${errorMessage}" th:text="'※' + ${errorMessage}"></p>

            <!-- キャンセル・登録ボタン -->
            <div class="assignment-action-row">
                <a th:href="@{/assignments}" class="btn-cancel-red">キャンセル</a>
                <button type="submit" class="btn-register-green">登録</button>
            </div>

            <p class="assignment-note">※名前の候補は、このチームのユーザーだけ</p>
        </form>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script>
        const sampleUsers = [
            { name: '田中 太郎', uid: 's12347' },
            { name: '山田 花子', uid: 's12345' },
            { name: '佐藤 次郎', uid: 's12348' }
        ];

        function onTargetTypeChange() {
            const selected = document.querySelector('input[name="targetType"]:checked');
            const pills = document.querySelectorAll('.target-pill');
            pills.forEach(p => p.classList.remove('is-active'));
            if (selected) {
                const parentLabel = selected.closest('.target-pill');
                if (parentLabel) parentLabel.classList.add('is-active');
            }

            const isTeam = selected && selected.value === 'team';
            const isIndividual = selected && selected.value === 'individual';

            const teamSec = document.getElementById('teamTargetSection');
            const indSec = document.getElementById('individualTargetSection');
            if (teamSec) teamSec.style.display = isTeam ? '' : 'none';
            if (indSec) indSec.style.display = isIndividual ? '' : 'none';
        }

        function filterCandidates() {
            const input = document.getElementById('userSearchInput');
            const listEl = document.getElementById('candidateList');
            const keyword = input.value.trim().toLowerCase();

            if (!keyword) {
                listEl.style.display = 'none';
                listEl.innerHTML = '';
                return;
            }

            const matches = sampleUsers.filter(u =>
                u.name.toLowerCase().includes(keyword) || u.uid.toLowerCase().includes(keyword)
            );

            if (matches.length === 0) {
                listEl.style.display = 'none';
                listEl.innerHTML = '';
                return;
            }

            listEl.innerHTML = '';
            matches.forEach(u => {
                const li = document.createElement('li');
                li.className = 'user-candidate-item';
                li.innerHTML = `<span>${escapeHtml(u.name)}</span><span class="user-candidate-id">ユーザーID：${escapeHtml(u.uid)}</span>`;
                li.onclick = () => selectCandidate(u.name, u.uid);
                listEl.appendChild(li);
            });
            listEl.style.display = 'block';
        }

        function selectCandidate(name, uid) {
            const container = document.getElementById('selectedUsersContainer');
            const input = document.getElementById('userSearchInput');
            const listEl = document.getElementById('candidateList');

            if (!container.querySelector(`input[name="assigneeIds"][value="${CSS.escape(uid)}"]`)) {
                const chip = document.createElement('div');
                chip.className = 'selected-user-chip';
                chip.setAttribute('data-uid', uid);
                chip.innerHTML = `
          <span class="chip-user-name">${escapeHtml(name)}</span>
          <span class="chip-user-id">ID:${escapeHtml(uid)}</span>
          <button type="button" class="chip-remove-btn" onclick="removeUserChip(this)" aria-label="削除">&times;</button>
          <input type="hidden" name="assigneeIds" value="${escapeHtml(uid)}">
        `;
                container.appendChild(chip);
            }

            input.value = '';
            listEl.style.display = 'none';
            listEl.innerHTML = '';
        }

        function removeUserChip(btn) {
            const chip = btn.closest('.selected-user-chip');
            if (chip) chip.remove();
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.user-search-box')) {
                const listEl = document.getElementById('candidateList');
                if (listEl) listEl.style.display = 'none';
            }
        });
    </script>
</body>

</html>
