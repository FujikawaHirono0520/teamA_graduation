<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>課題登録 - 課題管理システム</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="page-bg">

    <!-- ヘッダー（共通フラグメントを使う場合は差し替え可能） -->
    </div>
    <header th:replace="~{fragments/header :: header(true)}"></header>

    <div class="mobile-frame">
        <!-- 画面内ヘッダーバー（デザイン見本に合わせた表示） -->
        <div class="top-banner">
            <div class="banner-title">課題管理システム</div>
            <div class="banner-sub" th:if="${session.loginUid != null}" th:text="'ユーザーID：' + ${session.loginUid}">
                ユーザーID：s12345</div>
        </div>

        <main class="form-container">
            <!-- 戻る・タイトル・リーダーバッジ -->
            <div class="title-header">
                <a th:href="@{/assignments}" class="back-btn">&larr; 課題登録</a>
                <span class="role-pill">リーダー</span>
            </div>

            <form th:action="@{/assignments/create}" th:object="${form}" method="post" enctype="multipart/form-data"
                novalidate>
                <!-- 課題名 -->
                <div class="field-group">
                    <label for="title" class="field-label">課題名</label>
                    <input type="text" id="title" class="text-input" th:field="*{title}" placeholder="例）第4回レポート課題">
                    <p class="error-text" th:if="${titleErrorMessage}" th:text="'※' + ${titleErrorMessage}"></p>
                </div>

                <!-- 対象（チーム / 個人） -->
                <div class="field-group">
                    <span class="field-label">対象</span>
                    <div class="target-selector">
                        <label class="choice-pill" th:classappend="${form.targetType == 'team'} ? ' is-active' : ''">
                            <input type="radio" name="targetType" value="team" th:field="*{targetType}"
                                onchange="onTargetTypeChange()">
                            <span>チーム</span>
                        </label>
                        <label class="choice-pill"
                            th:classappend="${form.targetType == 'individual'} ? ' is-active' : ''">
                            <input type="radio" name="targetType" value="individual" th:field="*{targetType}"
                                onchange="onTargetTypeChange()">
                            <span>個人</span>
                        </label>
                    </div>
                    <p class="error-text" th:if="${targetErrorMessage}" th:text="'※' + ${targetErrorMessage}"></p>
                </div>

                <!-- チーム選択（チーム選択時に表示） -->
                <div class="field-group" id="teamTargetSection"
                    th:style="${form.targetType == 'team'} ? '' : 'display: none;'">
                    <label for="teamId" class="field-label">チーム</label>
                    <select id="teamId" class="select-input" th:field="*{teamId}">
                        <option value="">チームを選択してください</option>
                        <option th:each="team : ${leaderTeams}" th:value="${team}" th:text="${team}"></option>
                    </select>
                </div>

                <!-- 名前で検索・選択（個人選択時に表示） -->
                <div class="field-group" id="individualTargetSection"
                    th:style="${form.targetType == 'individual'} ? '' : 'display: none;'">
                    <label for="userSearchInput" class="field-label">名前で検索（複数選択可）</label>
                    <div class="search-box-wrapper">
                        <input type="text" id="userSearchInput" class="text-input" placeholder="田中"
                            oninput="filterCandidates()" autocomplete="off">
                        <!-- 検索候補ドロップダウン（必要に応じてAPI/Modelから取得した候補に差し替え） -->
                        <ul id="candidateList" class="candidate-list" style="display: none;"></ul>
                    </div>

                    <!-- 選択済みユーザーチップ -->
                    <div id="selectedUsersContainer" class="selected-chips">
                        <div class="user-chip" th:each="userId : ${form.assigneeIds}" th:data-uid="${userId}">
                            <span class="chip-name" th:text="${userId}"></span>
                            <span class="chip-id" th:text="'ID:' + ${userId}"></span>
                            <button type="button" class="chip-close" onclick="removeUserChip(this)"
                                aria-label="削除">&times;</button>
                            <input type="hidden" name="assigneeIds" th:value="${userId}">
                        </div>
                    </div>
                </div>

                <!-- 締め切り日時 -->
                <div class="field-group">
                    <label for="dueDate" class="field-label">締め切り日時</label>
                    <input type="datetime-local" id="dueDate" class="text-input" th:field="*{dueDate}">
                    <p class="error-text" th:if="${dueDateErrorMessage}" th:text="'※' + ${dueDateErrorMessage}"></p>
                </div>

                <!-- 優先順位 -->
                <div class="field-group">
                    <label for="priority" class="field-label">優先順位</label>
                    <select id="priority" class="select-input" th:field="*{priority}">
                        <option value="高">高</option>
                        <option value="中" selected>中</option>
                        <option value="低">低</option>
                    </select>
                </div>

                <!-- 説明・添付資料 -->
                <div class="field-group">
                    <label for="description" class="field-label">説明・添付資料</label>
                    <textarea id="description" class="textarea-input" th:field="*{description}" rows="3"
                        placeholder="内容を入力（ファイルを添付）"></textarea>
                    <div class="file-row">
                        <input type="file" id="attachmentFile" class="file-input" th:field="*{attachmentFile}">
                    </div>
                </div>

                <!-- 登録失敗エラー -->
                <p class="error-text" th:if="${errorMessage}" th:text="'※' + ${errorMessage}"></p>

                <!-- キャンセル・登録ボタン -->
                <div class="submit-row">
                    <a th:href="@{/assignments}" class="action-btn btn-cancel">キャンセル</a>
                    <button type="submit" class="action-btn btn-submit">登録</button>
                </div>

                <p class="footer-note">※名前の候補は、このチームのユーザーだけ</p>
            </form>
        </main>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script>
        // サンプル候補データ（実運用ではControllerやAPIから渡したユーザー一覧に置き換えてください）
        const sampleUsers = [
            { name: '田中 太郎', uid: 's12347' },
            { name: '山田 花子', uid: 's12345' },
            { name: '佐藤 次郎', uid: 's12348' }
        ];

        function onTargetTypeChange() {
            const selected = document.querySelector('input[name="targetType"]:checked');
            const pills = document.querySelectorAll('.choice-pill');
            pills.forEach(p => p.classList.remove('is-active'));
            if (selected) {
                const parentLabel = selected.closest('.choice-pill');
                if (parentLabel) parentLabel.classList.add('is-active');
            }

            const isTeam = selected && selected.value === 'team';
            const isIndividual = selected && selected.value === 'individual';

            const teamSec = document.getElementById('teamTargetSection');
            const indSec = document.getElementById('individualTargetSection');
            if (teamSec) teamSec.style.display = isTeam ? '' : 'none';
            if (indSec) indSec.style.display = isIndividual ? '' : 'none';
        }

        function filterCandidates() {
            const input = document.getElementById('userSearchInput');
            const listEl = document.getElementById('candidateList');
            const keyword = input.value.trim().toLowerCase();

            if (!keyword) {
                listEl.style.display = 'none';
                listEl.innerHTML = '';
                return;
            }

            const matches = sampleUsers.filter(u =>
                u.name.toLowerCase().includes(keyword) || u.uid.toLowerCase().includes(keyword)
            );

            if (matches.length === 0) {
                listEl.style.display = 'none';
                listEl.innerHTML = '';
                return;
            }

            listEl.innerHTML = '';
            matches.forEach(u => {
                const li = document.createElement('li');
                li.className = 'candidate-item';
                li.innerHTML = `<span>${escapeHtml(u.name)}</span><span class="candidate-uid">ユーザーID：${escapeHtml(u.uid)}</span>`;
                li.onclick = () => selectCandidate(u.name, u.uid);
                listEl.appendChild(li);
            });
            listEl.style.display = 'block';
        }

        function selectCandidate(name, uid) {
            const container = document.getElementById('selectedUsersContainer');
            const input = document.getElementById('userSearchInput');
            const listEl = document.getElementById('candidateList');

            if (!container.querySelector(`input[name="assigneeIds"][value="${CSS.escape(uid)}"]`)) {
                const chip = document.createElement('div');
                chip.className = 'user-chip';
                chip.setAttribute('data-uid', uid);
                chip.innerHTML = `
        <span class="chip-name">${escapeHtml(name)}</span>
        <span class="chip-id">ID:${escapeHtml(uid)}</span>
        <button type="button" class="chip-close" onclick="removeUserChip(this)" aria-label="削除">&times;</button>
        <input type="hidden" name="assigneeIds" value="${escapeHtml(uid)}">
      `;
                container.appendChild(chip);
            }

            input.value = '';
            listEl.style.display = 'none';
            listEl.innerHTML = '';
        }

        function removeUserChip(btn) {
            const chip = btn.closest('.user-chip');
            if (chip) chip.remove();
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-box-wrapper')) {
                const listEl = document.getElementById('candidateList');
                if (listEl) listEl.style.display = 'none';
            }
        });
    </script>
</body>

</html>
