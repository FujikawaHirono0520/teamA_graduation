
<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>パスワード変更 - 課題管理システム</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- ヘッダー -->
    <header th:replace="~{fragments/header :: header(true)}"></header>

    <main class="container">

        <!-- タイトル -->
        <div class="page-title-container">
            <a th:href="@{/settings}" class="back-link">←</a>
            <h1>パスワード変更</h1>
        </div>

        <!-- パスワード変更フォーム -->
        <form id="passwordChangeForm"
              th:action="@{/password_change_page}"
              method="post">

            <!-- 現在のパスワード -->
            <label for="currentPassword">現在のパスワード</label>
            <input type="password"
                   id="currentPassword"
                   name="currentPassword">

            <!-- 新しいパスワード -->
            <label for="newPassword">新しいパスワード</label>
            <input type="password"
                   id="newPassword"
                   name="newPassword">

            <!-- 新しいパスワード（確認） -->
            <label for="confirmPassword">新しいパスワード（確認）</label>
            <input type="password"
                   id="confirmPassword"
                   name="confirmPassword">

            <!-- エラーメッセージ -->
            <p class="error"
               id="errorMessage"
               hidden>
            </p>

            <!-- ボタン -->
            <div class="team-create-buttons">

                <!-- キャンセル -->
                <a th:href="@{/settings}"
                   class="team-cancel-btn">
                    キャンセル
                </a>

                <!-- 変更する -->
                <button type="submit" class="team-submit-btn">
                    変更する
                </button>

            </div>

        </form>

    </main>

    <!-- フッター -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- パスワード変更処理 -->
    <script>
        const form = document.getElementById("passwordChangeForm");
        const errorMessage = document.getElementById("errorMessage");

        form.addEventListener("submit", async function(event) {

            // 通常のフォーム送信を止める
            event.preventDefault();

            // エラーメッセージを消す
            errorMessage.textContent = "";
            errorMessage.hidden = true;

            try {
                // フォームの入力内容を送信する
                const response = await fetch(form.action, {
                    method: "POST",
                    body: new URLSearchParams(new FormData(form))
                });

                // サーバーからの結果を取得する
                const result = await response.json();

                if (response.ok) {

                    // パスワード変更成功
                    alert(result.successMessage);

                    // 設定画面に戻る
                    window.location.href = "/settings";

                } else {

                    // エラーメッセージを表示する
                    errorMessage.textContent = result.errorMessage;
                    errorMessage.hidden = false;
                }

            } catch (error) {

                // 通信に失敗した場合
                errorMessage.textContent = "パスワードの変更に失敗しました";
                errorMessage.hidden = false;
            }
        });
    </script>

</body>
</html>
