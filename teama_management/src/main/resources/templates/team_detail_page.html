<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>チーム詳細 - 課題管理システム</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- ヘッダー -->
    <header th:replace="~{fragments/header :: header(true)}"></header>

    <main class="container team-detail-container">
        <!-- エラーメッセージ -->
        <div th:if="${errorMessage}" class="team-error-message">
            <span th:text="${errorMessage}"></span>
        </div>

        <!-- タイトル -->
        <div class="assignment-title-bar">

            <div class="assignment-title-left">

                <!-- 戻るボタン -->
                <a th:href="@{/settings}" class="back-link">←</a>

                <h1>チーム詳細</h1>

            </div>

            <!-- 自分の役割 -->
            <span th:if="${userRole == 'leader'}"
                  class="settings-role settings-role-leader">
                リーダー
            </span>

            <span th:if="${userRole == 'user'}"
                  class="settings-role settings-role-user">
                ユーザー
            </span>

        </div>

        <!-- チーム情報 -->
        <div class="card team-detail-card">

            <!-- チーム名 -->
            <p class="team-detail-name"
               th:text="${teamName}">
            </p>

            <!-- チームID -->
            <p class="card-sub">
                チームID：
                <span th:text="${teamId}"></span>
            </p>

            <!-- 招待コード -->
            <div class="team-invite-row">

                <p class="card-sub">
                    招待コード：
                    <span id="inviteCode"
                          th:text="${inviteCode}">
                    </span>
                </p>

                <!-- コピー -->
                <button type="button"
                        class="settings-edit-btn"
                        onclick="copyInviteCode()">
                    コピー
                </button>

            </div>

            <!-- コピー完了メッセージ -->
            <p id="copyMessage" class="success" hidden>
                招待コードをコピーしました
            </p>

        </div>

        <!-- メンバー一覧タイトル -->
        <div class="team-detail-member-title">

            <h2>
                ユーザー
                （<span th:text="${memberCount}"></span>人）
            </h2>

            <!-- 編集ボタン -->
            <a th:href="@{/team_edit_page/{teamId}(teamId=${teamId})}"
               class="team-member-edit-btn"
               th:if="${userRole == 'leader'}">
                編集
            </a>

        </div>

        <!-- メンバー一覧 -->
        <div class="team-detail-members">

            <div class="team-detail-member"
                 th:each="member : ${members}">

                <!-- ユーザー名 -->
                <span class="team-detail-member-name"
                      th:text="${member.name}">
                </span>

                <!-- ユーザーID -->
                <span class="team-detail-member-id"
                      th:text="${member.id}">
                </span>

                <!-- リーダー -->
                <span th:if="${member.role == 'leader'}"
                      class="settings-role settings-role-leader">
                    リーダー
                </span>

                <!-- ユーザー -->
                <span th:if="${member.role == 'user'}"
                      class="settings-role settings-role-user">
                    ユーザー
                </span>

                <!-- メニュー（リーダー以外のメンバーに表示） -->
                <button type="button"
                        class="team-member-menu"
                        th:if="${userRole == 'leader' and member.role != 'leader'}"
                        th:attr="data-user-id=${member.id}, data-user-name=${member.name}"
                        onclick="openUserActionDialog(this)">
                    …
                </button>

            </div>

        </div>
        <!-- ① ユーザー操作ダイアログ -->
        <dialog id="userActionDialog" class="logout-dialog">
            <h1 id="actionDialogUserLabel"></h1>

            <div class="user-action-list">
                <button type="button"
                        id="openLeaderConfirmBtn"
                        class="action-outline-btn action-leader-btn">
                    リーダーにする
                </button>

                <button type="button"
                        id="openRemoveConfirmBtn"
                        class="action-outline-btn action-remove-btn">
                    チームから外す
                </button>

                <button type="button"
                        id="userActionCancelBtn"
                        class="btn logout-cancel-btn">
                    キャンセル
                </button>
            </div>
        </dialog>

        <!-- ② リーダー昇格確認ダイアログ -->
        <dialog id="leaderConfirmDialog" class="logout-dialog">
            <div>
                <h2 id="leaderConfirmTitle" class="user-action-title"></h2>
                <p class="dialog-sub-text">
                    リーダーは、課題の登録・承認や<br>
                    ユーザーの管理ができるようになります。
                </p>
            </div>

            <div class="logout-dialog-buttons">
                <button type="button"
                        id="leaderConfirmCancelBtn"
                        class="btn logout-cancel-btn">
                    キャンセル
                </button>

                <form th:action="@{/team/{teamId}/members/promote_leader(teamId=${teamId})}"
                      method="post">
                    <input type="hidden" name="targetUserId" id="leaderTargetUserId">
                    <input type="hidden" name="targetUserName" id="leaderTargetUserName">
                    <button type="submit"
                            class="btn leader-confirm-btn">
                        リーダーにする
                    </button>
                </form>
            </div>
        </dialog>

        <!-- ③ チーム除外確認ダイアログ -->
        <dialog id="removeMemberConfirmDialog" class="logout-dialog">
            <h2 id="removeConfirmTitle" class="user-action-title"></h2>

            <div class="logout-dialog-buttons">
                <button type="button"
                        id="removeConfirmCancelBtn"
                        class="btn logout-cancel-btn">
                    キャンセル
                </button>

                <form th:action="@{/team/{teamId}/members/remove(teamId=${teamId})}"
                      method="post">
                    <input type="hidden" name="targetUserId" id="removeTargetUserId">
                    <input type="hidden" name="targetUserName" id="removeTargetUserName">
                    <button type="submit"
                            class="btn logout-confirm-btn">
                        チームから外す
                    </button>
                </form>
            </div>
        </dialog>

        <!-- チーム削除 -->
        <button type="button"
                id="teamDeleteOpenButton"
                class="settings-logout"
                th:if="${userRole == 'leader'}">
            チームを削除
        </button>

        <!-- チーム削除確認ダイアログ -->
        <dialog id="teamDeleteDialog" class="logout-dialog">

            <!-- タイトル -->
            <h1 th:text="'チーム名：' + ${teamName} + ' を削除しますか？'">
            </h1>

            <!-- 注意文 -->
            <label>
                削除後は、登録した課題は消去され、
                復元することはできません。
            </label>

            <div class="logout-dialog-buttons">

                <!-- キャンセル -->
                <button type="button"
                        id="teamDeleteCancelButton"
                        class="btn logout-cancel-btn">
                    キャンセル
                </button>

                <!-- 削除 -->
                <form th:action="@{/team_delete/{teamId}(teamId=${teamId})}"
                    method="post">
                    <button type="submit"
                            class="btn logout-confirm-btn">
                        削除
                    </button>
                </form>

            </div>

        </dialog>

        <!-- スナックバー -->
        <div th:replace="~{snackbar :: snackbar}"></div>

    </main>

    <!-- フッター -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- 招待コードのコピー処理 -->
    <script>
        async function copyInviteCode() {

            // 招待コードを取得する
            const inviteCode =
                document.getElementById("inviteCode").textContent.trim();

            try {

                // 招待コードをコピーする
                await navigator.clipboard.writeText(inviteCode);

                // コピー完了メッセージを表示する
                document.getElementById("copyMessage").hidden = false;

            } catch (error) {

                // コピーに失敗した場合
                alert("招待コードのコピーに失敗しました");
            }
        }

        // 権限操作のダイアログ
        const userActionDialog = document.getElementById("userActionDialog");
        const leaderConfirmDialog = document.getElementById("leaderConfirmDialog");
        const removeMemberConfirmDialog = document.getElementById("removeMemberConfirmDialog");

        let selectedUser = { id: "", name: "" };

        // ① 「…」押下時：操作ダイアログを開く
        function openUserActionDialog(button) {
            selectedUser = {
                id: button.dataset.userId || "",
                name: button.dataset.userName || ""
            };

            document.getElementById("actionDialogUserLabel").textContent =
                `${selectedUser.name}`;

            if (userActionDialog && !userActionDialog.open) {
                userActionDialog.showModal();
            }
        }

        // ①の「キャンセル」：操作ダイアログを閉じる
        document.getElementById("userActionCancelBtn")?.addEventListener("click", () => {
            userActionDialog.close();
        });

        // ①の「リーダーにする」：②へ切り替え
        document.getElementById("openLeaderConfirmBtn")?.addEventListener("click", () => {
            document.getElementById("leaderConfirmTitle").textContent =
                `${selectedUser.name}さんをリーダーにしますか？`;
            document.getElementById("leaderTargetUserId").value = selectedUser.id;
            document.getElementById("leaderTargetUserName").value = selectedUser.name;

            userActionDialog.close();
            leaderConfirmDialog.showModal();
        });

        // ②の「キャンセル」：1つ前（①）へ戻る
        document.getElementById("leaderConfirmCancelBtn")?.addEventListener("click", () => {
            leaderConfirmDialog.close();
            userActionDialog.showModal();
        });

        // ①の「チームから外す」：③へ切り替え
        document.getElementById("openRemoveConfirmBtn")?.addEventListener("click", () => {
            document.getElementById("removeConfirmTitle").textContent =
                `${selectedUser.name}さんをチームから外しますか？`;
            document.getElementById("removeTargetUserId").value = selectedUser.id;
            document.getElementById("removeTargetUserName").value = selectedUser.name;

            userActionDialog.close();
            removeMemberConfirmDialog.showModal();
        });

        // ③の「キャンセル」：1つ前（①）へ戻る
        document.getElementById("removeConfirmCancelBtn")?.addEventListener("click", () => {
            removeMemberConfirmDialog.close();
            userActionDialog.showModal();
        });

        // チーム削除確認ダイアログ
        // ダイアログとボタンを取得
        const teamDeleteDialog =
            document.getElementById("teamDeleteDialog");

        const teamDeleteOpenButton =
            document.getElementById("teamDeleteOpenButton");

        const teamDeleteCancelButton =
            document.getElementById("teamDeleteCancelButton");

        // チームを削除ボタンを押したとき
        if (teamDeleteOpenButton) {

            teamDeleteOpenButton.addEventListener("click", () => {

                // 削除確認ダイアログを表示する
                teamDeleteDialog.showModal();

            });
        }

        // キャンセルボタンを押したとき
        teamDeleteCancelButton.addEventListener("click", () => {

            // 削除確認ダイアログを閉じる
            teamDeleteDialog.close();

        });
    </script>

</body>
</html>
