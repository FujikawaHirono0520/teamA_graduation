<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>課題詳細 - 課題管理システム</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- ヘッダー -->
    <header th:replace="~{fragments/header :: header(true)}"></header>

    <main class="container">

        <!-- 戻る・タイトル・ユーザー表示 -->
        <div class="assignment-title-bar">
            <div class="assignment-title-left">
                <a th:href="@{/assignments}" class="back-link">←</a>
                <h1>課題詳細</h1>
            </div>
            <span class="settings-role settings-role-user">ユーザー</span>
        </div>

        <!-- 課題情報 -->
        <section class="assignment-detail-info">
            <h2 class="assignment-manage-name"
                th:text="${assignment.title}">課題名</h2>

            <p class="assignment-manage-info">
                <span class="assignment-detail-row">
                    <span th:text="'担当：' + ${assignment.assigneeName}"></span>
                    <span th:text="'優先順位：' + ${assignment.priorityLabel}"></span>
                </span>
                <span th:text="'締め切り：' + ${assignment.dueDateText}"></span>
            </p>
        </section>

        <!-- ステータス -->
        <section class="assignment-status-section">

            <!-- 提出前 -->
            <form th:if="${assignment.status != 'waitingApproval'
                        and assignment.status != '承認待ち'
                        and assignment.status != 'approved'
                        and assignment.status != 'completed'
                        and assignment.status != '承認済み'
                        and assignment.status != 'resubmit'
                        and assignment.status != '再提出'}"
                th:action="@{/assignments/{id}/status(id=${assignment.id})}"
                method="post">

                <div class="assignment-status-row">
                    <span class="assignment-status-title">ステータス</span>

                    <label class="assignment-status-option">
                        <input type="radio"
                            name="status"
                            value="notStarted"
                            th:checked="${assignment.status == 'notStarted'
                                            or assignment.status == '未着手'}"
                            onchange="this.form.submit()">
                        未着手
                    </label>

                    <label class="assignment-status-option">
                        <input type="radio"
                            name="status"
                            value="inProgress"
                            th:checked="${assignment.status == 'inProgress'
                                            or assignment.status == '着手中'}"
                            onchange="this.form.submit()">
                        着手中
                    </label>
                </div>
            </form>

            <!-- 提出後 -->
            <div th:if="${assignment.status == 'waitingApproval'
                        or assignment.status == '承認待ち'}"
                class="assignment-status-row">

                <span class="assignment-status-title">ステータス</span>
                <span class="assignment-submitted-status">承認待ち</span>
            </div>

            <!-- 再提出 -->
            <div th:if="${assignment.status == 'resubmit'
                        or assignment.status == '再提出'}"
                class="assignment-status-row">

                <span class="assignment-status-title">ステータス</span>
                <span class="assignment-submitted-status"
                      style="background-color: red;">
                    再提出
                </span>
            </div>

            <!-- 承認済み -->
            <div th:if="${assignment.status == 'approved'
                        or assignment.status == 'completed'
                        or assignment.status == '承認済み'}"
                class="assignment-status-row">

                <span class="assignment-status-title">ステータス</span>
                <span class="assignment-submitted-status">完了</span>
            </div>

        </section>

        <!-- 提出完了メッセージ -->
        <div th:if="${assignment.status == 'waitingApproval'
                    or assignment.status == '承認待ち'}"
             class="assignment-submitted-message">

            提出が完了しました。リーダーの確認をお待ちください。

        </div>

        <!-- 再提出メッセージ -->
        <div th:if="${assignment.showResubmissionReason}"
             class="assignment-resubmit-message">

            再提出をお願いされました<br>
            <span th:text="${assignment.submittedByName}"></span>：
            <span th:text="${assignment.resubmissionReason}"></span>

        </div>

        <!-- リーダーからの説明 -->
        <section class="detail-section">
            <h3>リーダーからの説明</h3>

            <div class="detail-description"
                 th:text="${assignment.description}">
            </div>

            <p th:if="${assignment.hasAttachment}">
                <span>提出形式などの参考資料が登録されています。</span>
            </p>
        </section>

        <!-- コメント -->
        <section class="assignment-detail-block">

            <h3 class="assignment-block-title">コメント</h3>

            <!-- コメント一覧 -->
            <div th:each="comment : ${comments}"
                 class="assignment-comment">

                <div class="assignment-comment-info">
                    <span th:text="${comment.userName}">ユーザー名</span>
                    <span th:text="${comment.createdAtText}">投稿日時</span>
                </div>

                <div class="assignment-comment-body"
                     th:text="${comment.body}">
                    コメント内容
                </div>

            </div>

            <!-- コメント入力 -->
            <form th:action="@{/assignments/{id}/comment(id=${assignment.id})}"
                  method="post"
                  class="assignment-comment-form">

                <input type="text"
                       name="body"
                       placeholder="コメントを入力"
                       maxlength="500"
                       required>

                <button type="submit" class="btn-blue">
                    送信
                </button>

            </form>

        </section>

        <!-- 提出資料 -->
        <section class="detail-section">
            <h3>提出資料</h3>

            <p class="detail-note"
               th:if="${assignment.status != 'resubmit'
                       and assignment.status != '再提出'}">
                ファイル添付機能は次の段階で実装予定
            </p>

            <p class="detail-note"
               th:if="${assignment.status == 'resubmit'
                       or assignment.status == '再提出'}">
                提出資料を修正して再提出してください。
            </p>
        </section>

        <!-- チェックリスト -->
        <section class="assignment-detail-block">

            <h3 class="assignment-block-title">
                チェックリスト
                <span th:text="'(' + ${#lists.size(checklists)} + '件)'">(0件)</span>
            </h3>

            <!-- チェックリスト一覧 -->
            <div th:each="checklist : ${checklists}"
                 class="assignment-checklist-item">

                <!-- チェック状態変更 -->
                <form th:action="@{/assignments/{id}/checklist/{checklistId}/status(
                                id=${assignment.id},
                                checklistId=${checklist.checklistId})}"
                      method="post"
                      class="assignment-checklist-form">

                    <label class="assignment-checklist-label">

                        <input type="checkbox"
                               name="isChecked"
                               value="true"
                               th:checked="${checklist.isChecked}"
                               onchange="this.form.submit()">

                        <span th:text="${checklist.title}"
                              th:classappend="${checklist.isChecked} ? ' checklist-checked' : ''">
                            チェック項目
                        </span>

                    </label>

                </form>

                <!-- 削除 -->
                <form th:action="@{/assignments/{id}/checklist/{checklistId}/delete(
                                id=${assignment.id},
                                checklistId=${checklist.checklistId})}"
                      method="post">

                    <button type="submit"
                            class="assignment-checklist-delete">
                        −
                    </button>

                </form>

            </div>

            <!-- チェックリスト追加ボタン -->
            <button type="button"
                    id="checklistOpenButton"
                    class="assignment-checklist-open-btn"
                    onclick="showChecklistForm()">
                ＋ チェックリスト追加
            </button>

            <!-- チェックリスト追加フォーム -->
            <form th:action="@{/assignments/{id}/checklist(id=${assignment.id})}"
                  method="post"
                  id="checklistAddForm"
                  class="assignment-checklist-add-form"
                  style="display: none;">

                <input type="text"
                       name="title"
                       placeholder="入力してください"
                       maxlength="100"
                       required>

                <button type="submit" class="assignment-checklist-add-btn">
                    追加
                </button>

            </form>

        </section>

        <!-- 提出 -->
        <section class="assignment-submit-section">

            <!-- 提出前・再提出 -->
            <button th:if="${assignment.status != 'waitingApproval'
                            and assignment.status != '承認待ち'
                            and assignment.status != 'approved'
                            and assignment.status != 'completed'
                            and assignment.status != '承認済み'}"
                    type="button"
                    class="btn btn-green"
                    onclick="document.getElementById('submitDialog').showModal()">

                <span th:if="${assignment.status == 'resubmit'
                            or assignment.status == '再提出'}">
                    再提出する
                </span>

                <span th:unless="${assignment.status == 'resubmit'
                                or assignment.status == '再提出'}">
                    提出する
                </span>

            </button>

            <!-- 提出後 -->
            <button th:if="${assignment.status == 'waitingApproval'
                            or assignment.status == '承認待ち'}"
                    type="button"
                    class="btn assignment-submitted-button"
                    disabled>
                提出済み（承認待ち）
            </button>

            <!-- 承認済み -->
            <button th:if="${assignment.status == 'approved'
                            or assignment.status == 'completed'
                            or assignment.status == '承認済み'}"
                    type="button"
                    class="btn assignment-submitted-button"
                    disabled>
                提出済み（完了）
            </button>

        </section>

        <!-- 提出確認ダイアログ -->
        <dialog id="submitDialog"
                class="logout-dialog assignment-submit-dialog">

            <!-- 課題名 -->
            <h1>
                課題名：
                <span th:text="${assignment.title}">課題名</span>
            </h1>

            <!-- 注意事項 -->
            <p class="assignment-submit-message">
                提出すると、リーダーが確認できる状態になります。<br>
                提出後は、承認されるまで提出物を変更できません。
            </p>

            <!-- ボタン -->
            <div class="logout-dialog-buttons">

                <!-- キャンセル -->
                <button type="button"
                        class="btn logout-cancel-btn"
                        onclick="document.getElementById('submitDialog').close()">
                    キャンセル
                </button>

                <!-- 提出 -->
                <form th:action="@{/assignments/{id}/submit(id=${assignment.id})}"
                      method="post">

                    <button type="submit"
                            class="btn assignment-submit-confirm-btn">
                        提出する
                    </button>

                </form>

            </div>

        </dialog>

    </main>

    <script>
        // チェックリスト追加フォームを表示する
        function showChecklistForm() {
            document.getElementById("checklistOpenButton").style.display = "none";
            document.getElementById("checklistAddForm").style.display = "flex";
            document.querySelector("#checklistAddForm input").focus();
        }
    </script>

</body>
</html>
