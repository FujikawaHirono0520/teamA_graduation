<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>送信完了 - 課題管理システム</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- ヘッダー -->
    <div th:replace="~{fragments/header :: header(false)}"></div>

    <main class="container reset-sent-container">

        <!-- ① 画面タイトル -->
        <h1 class="reset-sent-title">メールを送信しました</h1>

        <!-- ② 送信完了メッセージ -->
        <div class="reset-sent-message">
            <p>
                <span th:text="${email}">example@school.ac.jp</span>
                宛てに、
            </p>
            <p>パスワード再設定用のメールを送りました。</p>
            <p>
                メールのリンクから、新しいパスワードを設定してください。
            </p>
        </div>

        <!-- ③ 注意事項 -->
        <div class="reset-sent-notice">
            <p>メールが届かないときは、次の点を確認してください。</p>
            <ul>
                <li>迷惑メールフォルダを確認する</li>
                <li>入力したメールアドレスが正しいか確認する</li>
            </ul>
        </div>

        <!-- 再送信エラー -->
        <p class="error"
           th:if="${resendError}"
           th:text="${resendError}">
        </p>

        <!-- ④ もう一度送る -->
        <form th:action="@{/forgot-password/resend}"
              method="post"
              class="reset-resend-form">

            <button type="submit"
                    id="resendButton"
                    class="reset-resend-btn"
                    disabled>
                もう一度送る（60秒）
            </button>
        </form>

        <!-- ⑤ ログインに戻る -->
        <a th:href="@{/login}" class="reset-login-btn">
            ログインに戻る
        </a>

    </main>

    <script th:inline="javascript">
        let remainingSeconds = /*[[${remainingSeconds}]]*/ 60;

        const resendButton = document.getElementById("resendButton");

        function updateResendButton() {
            if (remainingSeconds > 0) {
                resendButton.disabled = true;
                resendButton.textContent =
                    "もう一度送る（" + remainingSeconds + "秒）";
                remainingSeconds--;
            } else {
                resendButton.disabled = false;
                resendButton.textContent = "もう一度送る";
            }
        }

        updateResendButton();

        const countdown = setInterval(() => {
            updateResendButton();

            if (remainingSeconds < 0) {
                clearInterval(countdown);
            }
        }, 1000);
    </script>

</body>
</html>
