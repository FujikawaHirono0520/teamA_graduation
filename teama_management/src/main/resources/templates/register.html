<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>新規登録 - 課題管理システム</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
  </head>
  <body>
    <!-- ヘッダー -->
    <div th:replace="~{fragments/header :: header(false)}"></div>
    <main class="container">
      <div class="page-title-container">
        <a th:href="@{/login}" class="back-link">
            ←
        </a>
        <h1>新規登録</h1>
      </div>
      <form th:action="@{/register}" th:object="${form}" method="post" novalidate>
        <label for="username">ユーザー名</label>
        <input type="text" id="username" th:field="*{username}">

        <label for="email">メールアドレス</label>
        <input type="text" id="email" th:field="*{email}">

        <label for="password">パスワード</label>
        <input type="password" id="password" th:field="*{password}">

        <label for="confirmPassword">パスワード（確認用）</label>
        <input type="password" id="confirmPassword" th:field="*{confirmPassword}">

        <p class="error" th:if="${errorMessage}" th:text="'※' + ${errorMessage}"></p>

        <button type="submit" class="btn btn-water-blue">新規登録</button>
      </form>
    </main>
    <!-- フッター -->
    <div th:replace="~{fragments/footer :: footer}"></div>
  </body>
</html>
