<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>設定 - 課題管理システム</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="profile-page">

    <!-- ヘッダー -->
    <div class="profile-header-wrapper">
        <header th:replace="~{fragments/header :: header(true)}"></header>
    </div>

    <main class="container profile-container">

        <h1>設定</h1>

        <!-- ユーザー情報 -->
        <form class="profile-card"
              th:action="@{/profile/edit}"
              method="post">

            <div class="profile-icon">人</div>

            <div class="profile-info">

                <!-- 通常時のユーザー名 -->
                <p class="profile-name"
                   id="usernameDisplay"
                   th:text="${username}"
                   th:style="${editMode} ? 'display:none' : ''">
                </p>

                <!-- 編集時の入力欄 -->
                <input type="text"
                       id="usernameInput"
                       name="username"
                       th:value="${usernameInput != null ? usernameInput : username}"
                       th:style="${editMode} ? '' : 'display:none'">

                <!-- ユーザーID -->
                <p class="profile-id">
                    ユーザーID：<span th:text="${uid}"></span>
                </p>

                <!-- エラーメッセージ -->
                <p class="error"
                   th:if="${errorMessage}"
                   th:text="'※' + ${errorMessage}">
                </p>

            </div>

            <!-- 編集ボタン -->
            <button type="button"
                    class="profile-edit-btn"
                    id="editButton"
                    th:style="${editMode} ? 'display:none' : ''"
                    onclick="showUsernameEdit()">
                編集
            </button>

            <!-- 確定ボタン -->
            <button type="submit"
                    class="profile-edit-btn"
                    id="saveButton"
                    th:style="${editMode} ? '' : 'display:none'">
                確定
            </button>

        </form>

        <!-- アカウント -->
        <h2 class="profile-section-title">アカウント</h2>

        <div class="profile-menu">
            <a th:href="@{/password_change_page}"
               class="profile-menu-item">
                <span>パスワード変更</span>
                <span class="profile-menu-arrow">＞</span>
            </a>
        </div>

        <!-- 所属チーム -->
        <h2 class="profile-section-title">所属チーム</h2>

        <div class="profile-menu">

            <!-- 所属チーム一覧 -->
            <a th:each="team : ${teams}"
               th:href="@{/team_detail_page/{teamId}(teamId=${team.id})}"
               class="profile-menu-item">

                <!-- チーム名 -->
                <span th:text="${team.name}"></span>

                <!-- リーダーの場合 -->
                <span th:if="${team.role == 'leader'}"
                      class="team-role-badge team-leader">
                    リーダー
                </span>

                <!-- ユーザーの場合 -->
                <span th:if="${team.role == 'user'}"
                      class="team-role-badge team-user">
                    ユーザー
                </span>

                <!-- 右矢印 -->
                <span class="profile-menu-arrow">＞</span>

            </a>

            <!-- 所属チームがない場合 -->
            <a th:if="${#lists.isEmpty(teams)}"
               class="profile-menu-item">
                <span>所属しているチームはありません</span>
            </a>

            <!-- チーム作成 -->
            <a th:href="@{/team_create_page}"
               class="profile-menu-item">
                <span>＋ チームを作成</span>
                <span class="profile-menu-arrow">＞</span>
            </a>

            <!-- チーム参加 -->
            <a th:href="@{/team_join_page}"
               class="profile-menu-item">
                <span>招待コードでチームに参加</span>
                <span class="profile-menu-arrow">＞</span>
            </a>

        </div>

        <!-- ログアウト -->
        <button type="button"
                id="logoutOpenButton"
                class="profile-logout">
            ログアウト
        </button>


        <!-- ログアウト確認ダイアログ -->
        <dialog id="logoutDialog" class="logout-dialog">

            <h1>ログアウトしますか？</h1>

            <label>ログアウトすると、ログイン画面に戻ります。</label>

            <div class="logout-dialog-buttons">
                <!-- キャンセル -->
                <button type="button"
                        id="logoutCancelButton"
                        class="btn logout-cancel-btn">
                    キャンセル
                </button>
                <!-- ログアウト -->
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn logout-confirm-btn">
                        ログアウト
                    </button>
                </form>
            </div>

        </dialog>

    </main>

    <!-- フッター -->
    <div th:replace="~{fragments/footer :: footer}"></div>

</div>

<!-- ユーザー名編集処理 -->
<script>
    function showUsernameEdit() {

        // ユーザー名の表示を隠す
        document.getElementById("usernameDisplay").style.display = "none";

        // 入力欄を表示する
        document.getElementById("usernameInput").style.display = "block";

        // 編集ボタンを隠す
        document.getElementById("editButton").style.display = "none";

        // 確定ボタンを表示する
        document.getElementById("saveButton").style.display = "inline-block";

        // 入力欄にカーソルを合わせる
        document.getElementById("usernameInput").focus();
    }
    // ログアウト確認ダイアログ
    // ダイアログとボタンを取得
    const logoutDialog = document.getElementById("logoutDialog");
    const logoutOpenButton = document.getElementById("logoutOpenButton");
    const logoutCancelButton = document.getElementById("logoutCancelButton");

    // ログアウトボタンを押したとき
    logoutOpenButton.addEventListener("click", () => {
        logoutDialog.showModal();
    });

    // キャンセルボタンを押したとき
    logoutCancelButton.addEventListener("click", () => {
        logoutDialog.close();
    });
</script>
</body>
</html>
