<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ログイン - 課題管理システム</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
  </head>
  <body>
    <!-- ヘッダー -->
    <div th:replace="~{fragments/header :: header(false)}"></div>
    <main class="container">
      <h1>ログイン</h1>
      <form th:action="@{/login}" th:object="${form}" method="post" novalidate>
        <label for="email">メールアドレス</label>
        <input type="text" id="email" th:field="*{email}">

        <label for="password">パスワード</label>
        <input type="password" id="password" th:field="*{password}">

        <p class="error" th:if="${errorMessage}" th:text="'※' + ${errorMessage}"></p>

        <button type="submit" class="btn btn-water-blue">ログイン</button>
      </form>
      <hr>
      <div class="page-title-container login-links">
        <p><a th:href="@{/register}">新規登録</a></p><p>　/　</p>
        <p><a th:href="@{/forgot-password}">パスワードをお忘れですか？</a></p>
      </div>
    </main>
  </body>
</html>
