<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ログイン - 課題管理システム</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="app-header">課題管理システム</header>
<main class="container">
  <h1>ログイン</h1>
  <form th:action="@{/login}" th:object="${form}" method="post" novalidate>
    <label for="email">メールアドレス</label>
    <input type="text" id="email" th:field="*{email}">

    <label for="password">パスワード</label>
    <input type="password" id="password" th:field="*{password}">

    <p class="error" th:if="${errorMessage}" th:text="'※' + ${errorMessage}"></p>

    <button type="submit" class="btn btn-green">ログイン</button>
  </form>
  <p><a th:href="@{/register}">新規登録</a></p>
</main>
</body>
</html>
