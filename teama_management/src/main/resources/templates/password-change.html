<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>パスワード変更 - 課題管理システム</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="app-header">課題管理システム</header>
<main class="container">
  <div class="page-title-container">
    <a th:href="@{/settings}" class="back-link">←</a>
    <h1>パスワード変更</h1>
  </div>

  <form th:action="@{/password/change}" th:object="${form}" method="post" novalidate>
    <label for="_currently_password">現在のパスワード</label>
    <input type="password" id="_currently_password" th:field="*{_currently_password}">

    <label for="_new_password">新しいパスワード</label>
    <input type="password" id="_new_password" th:field="*{_new_password}">

    <label for="_confirm_new_password">新しいパスワード（確認）</label>
    <input type="password" id="_confirm_new_password" th:field="*{_confirm_new_password}">

    <p class="error" th:if="${errorMessage}" th:text="'※' + ${errorMessage}"></p>

    <div class="btn-group">
      <a th:href="@{/settings}" class="btn btn-red">キャンセル</a>
      <button type="submit" class="btn btn-green">変更する</button>
    </div>
  </form>
</main>
</body>
</html>
