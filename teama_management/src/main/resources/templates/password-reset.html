<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>パスワード再設定 - 課題管理システム</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <!-- ヘッダー -->
    <div th:replace="~{fragments/header :: header(false)}"></div>
    <main class="container">
        <div class="page-title-container">
            <a th:href="@{/login}" class="back-link">
                ←
            </a>
            <h1>パスワード再設定</h1>
        </div>
        <p>
            登録したメールアドレスを入力してください。
            パスワード再設定用のメールをお送りします。
        </p>
        <form th:action="@{/forgot-password}" method="post">
            <div>
                <label for="email">メールアドレス</label>
                <input
                    type="text"
                    id="email"
                    name="email"
                    placeholder="example@school.ac.jp"
                    th:value="${email}">
            </div>

            <!-- エラーメッセージ -->
            <p class="error"
               th:if="${errorMessage}"
               th:text="'※' + ${errorMessage}">
            </p>
            <button type="submit" class="btn btn-water-blue">
                再設定メールを送る
            </button>
        </form>
    </main>
</body>
</html>
